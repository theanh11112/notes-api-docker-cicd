name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Test cần Postgres/Redis thật (context load test kết nối DB) —
    # GitHub Actions tự dựng 2 service này, expose qua localhost cho job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notesdb
          POSTGRES_USER: notes_user
          POSTGRES_PASSWORD: notes_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes_user -d notesdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/notesdb
          SPRING_DATASOURCE_USERNAME: notes_user
          SPRING_DATASOURCE_PASSWORD: notes_pass
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    # Chỉ build/push khi merge vào main — PR chỉ cần chạy test ở trên
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/notes-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/notes-api:${{ github.sha }}
      - name: Debug secret masking
        run: echo "Token thật là ${{ secrets.DOCKERHUB_TOKEN }}"
